<svg xmlns="http://www.w3.org/2000/svg" width="104" height="34" viewBox="0 0 104 34">
  <defs>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#231c19"/>
      <stop offset=".16" stop-color="#7d706a"/>
      <stop offset=".42" stop-color="#e9e3dd"/>
      <stop offset=".58" stop-color="#b0a59e"/>
      <stop offset=".82" stop-color="#4b423d"/>
      <stop offset="1" stop-color="#1e1815"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf9f7"/>
      <stop offset=".28" stop-color="#d6cfc9"/>
      <stop offset=".55" stop-color="#8f847d"/>
      <stop offset=".82" stop-color="#3f3733"/>
      <stop offset="1" stop-color="#6a605a"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a504a"/>
      <stop offset=".6" stop-color="#2e2724"/>
      <stop offset="1" stop-color="#4a413c"/>
    </linearGradient>
    <radialGradient id="hole" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1a120d"/>
      <stop offset=".7" stop-color="#2b1e15"/>
      <stop offset="1" stop-color="#4a3626" stop-opacity=".6"/>
    </radialGradient>
  </defs>
  <!-- punched hole in the page (the ring passes down through it) -->
  <ellipse cx="94" cy="18.5" rx="6.5" ry="4.6" fill="url(#hole)"/>
  <!-- back half of the ring, behind the spine -->
  <rect x="3" y="15.5" width="98" height="8.5" rx="4.25" fill="url(#ringBack)"/>
  <!-- spine bar -->
  <rect x="40" y="0" width="24" height="34" fill="url(#bar)"/>
  <rect x="40" y="0" width="24" height="1.4" fill="#000" opacity=".28"/>
  <rect x="40" y="32.6" width="24" height="1.4" fill="#fff" opacity=".12"/>
  <!-- front half of the ring -->
  <rect x="1.5" y="11" width="101" height="10.5" rx="5.25" fill="url(#ring)"/>
  <rect x="4" y="12.2" width="96" height="2.2" rx="1.1" fill="#fff" opacity=".55"/>
  <rect x="1.5" y="20" width="101" height="1.5" rx=".75" fill="#000" opacity=".22"/>
  <!-- the ring's curved ends catch the light -->
  <ellipse cx="6.5" cy="16.2" rx="5" ry="5.2" fill="url(#ring)"/>
  <ellipse cx="97.5" cy="16.2" rx="5" ry="5.2" fill="url(#ring)"/>
</svg>
